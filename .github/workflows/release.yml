name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: x86_64-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          strip archfinder 2>/dev/null || true
          tar czf ../../../archfinder-${{ matrix.name }}.tar.gz archfinder
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: archfinder-${{ matrix.name }}.tar.gz
          generate_release_notes: true

  arch-package:
    # Build a native pacman package (.pkg.tar.zst) in an Arch container
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm sudo git cargo shadow
          useradd -m builder
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix ownership
        run: chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build package
        run: |
          runuser -u builder -- env HOME=/home/builder bash -c \
            "cd '$GITHUB_WORKSPACE/packaging' && makepkg -f --noconfirm"
          mv packaging/*.pkg.tar.zst .
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: archfinder-*.pkg.tar.zst
          generate_release_notes: true
