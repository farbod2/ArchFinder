[package]
name = "archfinder"
version = "0.1.4"
edition = "2021"
description = "A fast, keyboard-driven TUI to find and reclaim unused files and folders on Arch Linux"
authors = ["farbod2"]
license = "GPL-3.0-or-later"
repository = "https://github.com/farbod2/ArchFinder"
readme = "README.md"
keywords = ["tui", "disk-usage", "cleanup", "arch-linux", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
jwalk = "0.8"
rayon = "1.10"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
rustix = { version = "0.38", features = ["fs"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
